<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style cal.css">
</head>
<body>
    <main id="container">
        <input type="text" placeholder="0">
        <section>
            <button class="op">AC</button>
            <button class="op">DEL</button>
            <button class="op">%</button>
            <button class="op">/</button>
        </section>
        <section>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="op">*</button>
        </section>
        <section>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="op">-</button>
        </section>
        <section>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="op">+</button>
        </section>
        <section>
            <button>0</button>
            <button>00</button>
            <button>.</button>
            <button class="res">=</button>
        </section>
    </main>


    <script src="./app.js"></script>
</body>
</html>
